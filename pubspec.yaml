name: lapkoyeth
description: "ЛапкойЭть — супер-приложение для владельцев питомцев"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Navigation
  go_router: ^14.0.0

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Local storage
  hive_flutter: ^1.1.0
  path_provider: ^2.1.4

  # Media
  image_picker: ^1.1.2

  # Integrations
  url_launcher: ^6.3.1

  # UI
  cupertino_icons: ^1.0.8

  # Utils
  intl: ^0.20.2
  crypto: ^3.0.3
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  cloud_firestore: ^6.7.1
  firebase_messaging: ^16.4.3
  firebase_storage: ^13.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/stories/
